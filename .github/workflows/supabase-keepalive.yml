# Supabase 無料プランは、1週間のアクセスが少ないとプロジェクトが一時停止される。
# 公式の目安は「1日に数回のリクエストが1週間続くこと」なので、
# 1日3回、それぞれ数回の読み取りを送って停止を防ぐ。
name: Supabase keepalive

on:
  schedule:
    - cron: "17 0 * * *"    # 毎日 09:17 JST
    - cron: "17 8 * * *"    # 毎日 17:17 JST
    - cron: "17 15 * * *"   # 毎日 00:17 JST
  workflow_dispatch:         # Actions画面から手動実行もできる

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read from global_timeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          for i in 1 2 3; do
            # 失敗してもここでは止めず、原因ごとに分かりやすいメッセージを出す
            set +e
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
              "$SUPABASE_URL/rest/v1/global_timeline?select=id&limit=1" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY")
            code=$?
            set -e

            if [ "$code" = "6" ]; then
              echo "::error::Supabase のアドレスが見つかりません。プロジェクトが一時停止（Paused）していないか、ダッシュボードで確認してください。"
              exit 1
            elif [ "$code" != "0" ]; then
              echo "::error::Supabase に接続できませんでした（curl の終了コード $code）。"
              exit 1
            elif [ "$status" != "200" ]; then
              echo "::error::Supabase から HTTP $status が返りました。Secrets の SUPABASE_URL / SUPABASE_KEY を確認してください。"
              exit 1
            fi
            echo "読み取り $i 回目: HTTP $status"
            sleep 5
          done
